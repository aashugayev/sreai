[Ollama]
# Base URL of the local Ollama server. No API key is needed for local models.
Host:http://localhost:11434
# Model name is configuration, not hard-coded, so it can be swapped freely.
Model:qwen2.5:7b
# Seconds to wait for a response. First call after boot is slow: the model
# has to be loaded into GPU memory before any tokens are produced.
TimeoutSeconds:120
